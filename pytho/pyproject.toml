[project]
name = "ordering-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlieeLinux", email = "bazartroy531@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "faker>=40.43.0",
    "flask>=3.1.3",
    "jupyter>=1.1.1",
    "mariadb>=1.1.14",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pymysql>=1.2.3",
